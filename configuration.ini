[trainer]
n_epochs = 150
log_interval = 20
seed = 0
# Only for tracking environment
source = "bme32"

[data_loader]
batch_size_train = 128
batch_size_test = 256
custom_loader = True
use_selection = True
selection_name = "base"
remove_count = 2000
pb_discount = 0.9
prio_patience = 0
n_duplicate = 1000
n_undoable = 1000
# fit_count
explore_type = fit_count
# pb_error, label_change, uncertanity
exploit_type = pb_error
c_constant = 0
# ImageNet, Cifar100, Cifar10, TinyImagenet
data_folder_name = Cifar100
num_workers = 4


[augmentation]
on = True
probs = 0.9

crop = True
resize_param = 32
crop_probs = 0.8
crop_scale = (0.65, 0.95)

horizontal_flip = True
hf_probs = 0.5

vertical_flip = False
vf_probs = 0.5

color_jitter = True
brightness = 0.5
contrast = 0.4
saturation = 0.3
hue = 0.2
jitter_probs = 0.75

blur = True
window = 3
sigma = (0.4, 0.4)
blur_probs = 0.5

normalize = False

cutout = True
cutout_probs = 0.5
cutout_scale = (0.02, 0.08)
cutout_ratio = (0.3, 3)
cutout_value = 0
cutout_patch = 2

adjust_sharpness = True
sharpness_factor = 2.0
sharpness_probs = 0.4

[model]
# resnet50, mobilenet_v3_large, efficientnet_b1, efficientnet_b0
model_type = efficientnet_b1
pretrained = False

[callbacks]
neptune_logger_callback = True
neptune_token = eyJhcGlfYWRkcmVzcyI6Imh0dHBzOi8vYXBwLm5lcHR1bmUuYWkiLCJhcGlfdXJsIjoiaHR0cHM6Ly9hcHAubmVwdHVuZS5haSIsImFwaV9rZXkiOiJiYmRlNDFkZC1hZmMxLTQyNDktYmU0OC03N2IwMWRiYThkZjIifQ==
neptune_project = csanad-l-balogh/SL-outlier

[optim]
learning_rate = 0.00001
lr_decay = True
# cos, on_plateau, lin, exp, warmup_cos, wstep
lr_decay_type = warmup_cos
lr_min = 1e-8
# For wstep
boundaries = [50, 100, 125]
values = [0.0018, 0.001, 0.0001, 1e-6]
# warmup_epochs for warmup_cos and wstep lr decay
warmup_epochs = 20
warmup_lr_high = 0.003
momentum = 0.9
weight_decay = 0.0002
# cross_entropy, focal_loss
loss = focal_loss
# sgd, adam, rmsprop
optimizer = adam
# Adam parameters
beta1 = 0.9
beta2 = 0.999
amsgrad = False
# RMSprop parameters
alpha = 0.99
centered = False
# Adam AND RMSprop parameters
eps = 1e-3

# End of file
